<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Site HSE Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky control bar, tab rail, then summary tiles before charts before registers (site-board reading order). */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --surface-2:#f7f9f8; --ink:#14201c; --muted:#56665f; --faint:#7d8c86;
  --line:#dce3e0; --grid:#e8edea; --accent:#0f6e55; --accent-ink:#ffffff; --accent-soft:#e1f1ec;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --closed:#b9c4bf;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-bg:#e3f4e3; --warn-bg:#fff3d6; --serious-bg:#fde8df; --crit-bg:#fbe3e3; --info-bg:#e5eefb; --info-ink:#1f5fae;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#161e1b; --surface-2:#1b2521; --ink:#e6eeea; --muted:#9fb0a9; --faint:#7b8c85;
  --line:#2a3631; --grid:#25302c; --accent:#3fbf95; --accent-ink:#06130e; --accent-soft:#16352b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --closed:#4a5752;
  --good-bg:#14301a; --warn-bg:#3a2e0e; --serious-bg:#3b2219; --crit-bg:#3d1b1b; --info-bg:#172a42; --info-ink:#8ab8f2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#161e1b; --surface-2:#1b2521; --ink:#e6eeea; --muted:#9fb0a9; --faint:#7b8c85;
  --line:#2a3631; --grid:#25302c; --accent:#3fbf95; --accent-ink:#06130e; --accent-soft:#16352b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --closed:#4a5752;
  --good-bg:#14301a; --warn-bg:#3a2e0e; --serious-bg:#3b2219; --crit-bg:#3d1b1b; --info-bg:#172a42; --info-ink:#8ab8f2;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.bar .wrap.tw{padding-block:0}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand b{font:800 21px/1 var(--display);font-stretch:78%;letter-spacing:.01em;text-transform:uppercase}
.brand span{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ctl input,.ctl select{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;color:var(--ink);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.5;cursor:default}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 100%;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:10px 12px 9px;color:var(--muted);text-decoration:none;font-weight:500;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs a .cnt{font:500 11px var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 6px;margin-left:5px}
.tabs a .cnt.alert{background:var(--crit-bg);border-color:transparent;color:var(--crit)}

main{padding-block:18px 40px;display:grid;gap:22px}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);font-size:13px}
.banner b{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;font-size:12px;color:var(--muted);align-items:center}
.chip{display:inline-flex;gap:6px;align-items:center;max-width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:2px 10px;font-size:12px;white-space:nowrap}
.chip i{font-style:normal;color:var(--faint);overflow:hidden;text-overflow:ellipsis;min-width:0}
h2{font:700 13px/1 var(--display);font-stretch:85%;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
h2 small{font:400 12px var(--body);text-transform:none;letter-spacing:0;color:var(--faint);margin-left:8px}
section{min-width:0}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 16px;position:relative;display:grid;gap:2px;align-content:start;text-align:left}
.tile::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 2px 2px 0;background:var(--stripe,var(--line))}
.tile[data-s="crit"]{--stripe:var(--crit)} .tile[data-s="warn"]{--stripe:var(--warn)} .tile[data-s="good"]{--stripe:var(--good)} .tile[data-s="info"]{--stripe:var(--s1)}
button.tile{cursor:pointer;font:inherit;color:inherit}
button.tile:hover{border-color:var(--accent)}
.tile .l{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:750 34px/1.05 var(--display);font-stretch:72%;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile .v small{font:500 15px var(--body);color:var(--muted);margin-left:4px}
.tile .s{font-size:12px;color:var(--muted)}
.delta{font:500 11.5px var(--mono);padding:1px 6px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}

/* charts */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;min-width:0}
.card h3{margin:0 0 2px;font:600 14px var(--body)}
.card p.sub{margin:0 0 10px;color:var(--faint);font-size:12px}
.cv{position:relative;height:250px}
.cv.tall{height:300px}

/* filters + tables */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search]{flex:1 1 220px;min-width:0}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;font-size:13px;max-width:100%}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.03em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th[aria-sort="ascending"]::after{content:" ▲";font-size:9px} th[aria-sort="descending"]::after{content:" ▼";font-size:9px}
td{padding:7px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
td.n{text-align:right;white-space:nowrap}
td.d{white-space:nowrap}
td.desc{min-width:260px;max-width:520px}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
.rowcount{font-size:12px;color:var(--faint);margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:color-mix(in srgb,var(--warn) 55%,var(--ink))}
.p-serious{background:var(--serious-bg);color:var(--serious)} .p-crit{background:var(--crit-bg);color:var(--crit)}
.p-info{background:var(--info-bg);color:var(--info-ink)} .p-mute{background:var(--surface-2);color:var(--muted)}
.age{font:600 12.5px var(--mono)}
.age.a60{color:var(--crit)} .age.a30{color:var(--serious)}
.tag{font:600 10.5px var(--mono);padding:1px 5px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}

/* checks */
.checks{display:grid;gap:8px}
.check{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start}
.check .c{font:750 22px/1 var(--display);font-stretch:75%;min-width:38px;text-align:right}
.check .t{font-weight:600} .check .f{grid-column:2/4;color:var(--muted);font-size:12.5px}
.check details{grid-column:2/4;font-size:12px;color:var(--muted)} .check summary{cursor:pointer;color:var(--accent)}
.check ul{margin:6px 0 0;padding-left:18px;columns:2 280px}

.set{display:grid;gap:16px}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.fld{display:grid;gap:4px;font-size:13px;min-width:0}
.fld span{font-weight:600}
.fld small{color:var(--faint);font-size:12px}
.fld input,.fld textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;font:13px var(--body);color:var(--ink);width:100%;resize:vertical}
.range{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:grid;gap:6px;position:relative}
.fbar.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.flab{font:700 12px var(--display);font-stretch:85%;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.fsum{font-size:12px;color:var(--muted)}
.fsum b{color:var(--ink)}
.foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--faint);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
.drop{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(2px)}
.drop div{border:2px dashed var(--accent);border-radius:12px;padding:40px 48px;background:var(--surface);text-align:center;font:700 20px var(--display);font-stretch:85%;max-width:calc(100% - 32px)}
.drop div span{display:block;font:400 13px var(--body);color:var(--muted);margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:13px;max-width:min(640px,calc(100% - 32px));white-space:pre-line;box-shadow:0 6px 24px rgb(0 0 0 / .2)}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
@media (max-width:640px){.brand span{display:none}.tile .v{font-size:30px}.cv{height:220px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.bar .ctl,.bar .btn,.tabs,.foot,.filters,.banner{display:none!important}.bar{position:static}.card,.tile{break-inside:avoid}}
</style>

<header class="bar">
  <div class="wrap">
    <div class="brand"><b id="brandName">Site HSE</b><span id="subtitle"></span></div>
    <div class="range"><label class="ctl" for="from">From <input type="date" id="from"></label><label class="ctl" for="to" title="Report date: open items are aged to this date">To <input type="date" id="to"></label>
    <label class="ctl" for="preset"><span class="sr">Quick range</span><select id="preset" aria-label="Quick range"><option value="">Custom</option><option value="3">Last 3 days</option><option value="7">Last 7 days</option><option value="14">Last 14 days</option><option value="30">Last 30 days</option><option value="month">Month to date</option><option value="prevmonth">Previous month</option></select></label></div>
    <button class="btn" id="loadBtn" type="button">Load trackers</button>
    <button class="btn primary" id="xlsBtn" type="button">Download client Excel</button>
    <button class="btn" id="printBtn" type="button" hidden>Print / PDF</button>
    <input type="file" id="file" multiple accept=".xlsx,.xlsm,.xls,.xlsb" hidden>
  </div>
  <div class="wrap tw"><nav class="tabs" id="tabs" aria-label="Views"></nav></div>
</header>
<div class="wrap"><main id="view"></main>
  <div class="foot">
    <span>Your tracker data is read and stored only in this browser. Nothing is uploaded.</span>
    <button class="btn" id="clearBtn" type="button">Clear stored data</button>
  </div>
</div>
<div class="drop" id="drop" hidden><div>Drop tracker files<span>NCR / SOR / Stop Work tracker, contractor incident log or Aconex issues export</span></div></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
"use strict";
/* =====================================================================
   CONFIGURATION - edit these lists as the project evolves
   ===================================================================== */
// Project details are entered in the Settings tab and kept in this browser only.
const SETTINGS_KEY = "hse-dash-settings";
const DEFAULT_SETTINGS = { name: "", contract: "", contractor: "", consultant: "", earliestIssue: "2025-01-01", people: "", categories: "" };
const PROJECT = Object.assign({}, DEFAULT_SETTINGS, (() => { try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}"); } catch (e) { return {}; } })());

// Header text (any case/spacing) -> field. First exact match wins, then "starts with".
const DATASETS = {
  NCR: { label: "NCR", key: "descriptionofncr", required: "ref", fields: {
    category: ["category"], severity: ["ncrseverity", "severity"], ref: ["ncr", "ncrno", "ncrreference"], desc: ["descriptionofncr"],
    issue: ["issuedate"], raisedBy: ["raisedby"], respReq: ["responserequiredonorbefore"], closure: ["finalclosuredate"],
    status: ["status"], ontime: ["overdue/ontime"], remarks: ["remarks"] } },
  SOR: { label: "SOR", key: "descriptionofsor", required: "ref", fields: {
    category: ["category"], ref: ["sor", "sorno", "sorreference"], desc: ["descriptionofsor"], issue: ["issuedate"],
    raisedBy: ["raisedby"], respReq: ["responserequiredonorbefore"], closure: ["finalclosuredate"],
    status: ["status"], ontime: ["overdue/ontime"], remarks: ["remarks"] } },
  SWN: { label: "Stop Work", key: "descriptionofstopworknotice", required: "ref", fields: {
    ref: ["documentreference"], desc: ["descriptionofstopworknotice"], issue: ["issuedate"], raisedBy: ["raisedby"],
    respReq: ["responserequiredonorbefore"], respRecv: ["responsereceivedon"], closure: ["~returnedto", "~respondedandreturned"], status: ["status"],
    contractorRef: ["~gencorrref", "contractorref", "contractorreply"], remarks: ["remarks"] } },
  INC: { label: "Incident log", key: "dateofincident", required: "type", fields: {
    date: ["dateofincident"], contractor: ["contractor"], severity: ["actualincidentseverity"], hipo: ["highpotential"],
    type: ["incidenttype"], desc: ["shortdescriptionofincident"], injury: ["typeofinjury"], body: ["injuredpartofbody"],
    category: ["summaryincidentcategory"], rwd: ["no.restrictedworkdays"], lwd: ["no.lostworkdays"], eirc: ["eircheld"],
    suspended: ["worksuspended/stopped"], tbt: ["contractortoolboxtalkconducted"], lessons: ["contractorlessonslearned"],
    status: ["incidentstatusclosed/open", "incidentstatus"] } },
  // Aconex issues export: detected by an issue-number, status and raised/created-date column in the same header row
  ACX: { label: "Aconex", detect: { ref: 1, status: 1, issue: 1 }, required: "ref", optional: ["desc", "remarks", "assignedTo", "location", "raisedBy", "priority", "title"], fields: {
    ref: ["issueid", "issueno", "issueno.", "issuenumber", "issue#", "issueref", "issuereference", "id$", "no$", "no.$", "number$", "reference$"],
    title: ["title", "issuetitle", "subject", "summary"], desc: ["description$", "details$", "issuedescription"], type: ["issuetype", "type$", "category$", "issuecategory"],
    status: ["status", "issuestatus"], priority: ["priority", "severity$"], raisedBy: ["raisedby", "createdby", "reportedby", "author$", "originator"],
    assignedOrg: ["assignedtoorganization", "assignedtoorganisation", "assignedorganization", "assignedorganisation", "responsibleorganization", "responsibleorganisation", "responsiblecompany", "assignedtocompany", "organization$", "organisation$"],
    assignedTo: ["assignedto", "assignee", "responsibleperson", "responsible$", "assignedtouser"], location: ["location", "area$", "zone$"],
    issue: ["dateraised", "raiseddate", "raisedon", "datecreated", "createddate", "createdon", "dateopened", "openeddate", "created$", "opened$", "date$"],
    due: ["duedate", "datedue", "due$", "targetdate", "responsedue"], closure: ["dateclosed", "closeddate", "closedon", "datecompleted", "completeddate", "closed$"],
    remarks: ["comments", "remarks", "notes"] } },
};
// Extra name / category corrections come from the Settings tab ("typed = reported", one per line).
const parseMap = t => Object.fromEntries(String(t || "").split(/\n/).map(l => l.split("=")).filter(p => p.length === 2 && p[0].trim() && p[1].trim()).map(([a, b]) => [a.trim().toLowerCase(), b.trim()]));
let PEOPLE_MAP = parseMap(PROJECT.people);
const BASE_CATEGORY_MAP = { "fall from hieght (person)": "Fall from Height (Person)", "wah": "Work at Height (unclassified)" };
let INC_CATEGORY_MAP = Object.assign({}, BASE_CATEGORY_MAP, parseMap(PROJECT.categories));
const STD_CATEGORIES = ["Asset Damage","Confined Space Incident","Electrical Contact (Person)","Excavation Collapse","Exposure to Harmful Substance","Exposure to Noise","Exposure to Vibration","Fall From Height (Object)","Fall from Height (Person)","Fire","Health and Hygiene","Illness","Injury","Lifting Equipment","Lifting Incident (Other)","Manual Handling","Other","Person Hit Against","Person Hit By","Plant Damage","Plant People Interface","Plant Related Incident (Other)","Road / Traffic Incident (Public Highway)","Slip Trip and Fall","Spillage / Leak","Structural Collapse","Substance Related Incident","Utility Damage","Vehicle Related Incident (Within Site Boundary)","Working Platforms","Non Work Related Deaths (NADs)","Work at Height (unclassified)","Barricades and Fencing","Emergency Response"];
const TYPE_GROUPS = { "near miss": "Near Miss", "first aid case": "First Aid", "medical treatment case": "Recordable", "restricted work case": "Recordable",
  "lost workday case": "Recordable", "lost time injury": "Recordable", "fatality": "Recordable", "occupational illnesses": "Recordable", "vehicle incident (injuries)": "Recordable",
  "equipment / property damage": "Property / Equipment", "fire incident (no injuries)": "Property / Equipment", "vehicle incident (no injuries)": "Property / Equipment",
  "dangerous occurrence": "Other", "environmental incident": "Other", "non-occupational injury": "Other", "non-occupational fatality": "Other", "not applicable": "Other" };
const EVENT_GROUPS = ["Near Miss", "Recordable", "Property / Equipment", "First Aid", "Other"];
const SWN_THEMES = [["Lifting / Cranes", ["lift", "crane", "mast", "rigging"]], ["Work at Height", ["height", "wah", "scaffold", "edge"]],
  ["RAMS / Permits", ["rams", "jsa", "permit"]], ["Excavation", ["excavat", "trench"]], ["Environmental", ["dust", "waste", "spill", "environment"]],
  ["Storage / Housekeeping", ["storage", "laydown", "warehouse", "housekeeping"]]];
const STATUS = { OPEN: ["Awaiting response", "p-warn"], REJECTED: ["Rejected", "p-crit"], PENDING: ["Under review", "p-info"],
  RESPONDED: ["Responded", "p-info"], CLOSED: ["Closed", "p-good"], TERMINATED: ["Terminated", "p-mute"] };
const KNOWN_STATUS = Object.keys(STATUS);
const BUCKETS = ["0-7 days", "8-30 days", "31-60 days", ">60 days"];

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const DAY = 864e5, MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const norm = v => v == null ? "" : String(v).toLowerCase().replace(/[\s :]/g, "");
const txt = v => v == null ? "" : String(v).replace(/ /g, " ").replace(/\s+/g, " ").trim();

const VIEWS = [["overview", "Overview"], ["ncr", "NCR"], ["sor", "SOR"], ["stop-work", "Stop Work"], ["incidents", "Incidents"], ["aconex", "Aconex Issues"], ["open-items", "Open Items"], ["checks", "Data Checks"], ["history", "History"], ["settings", "Settings"]];
function route() { const h = location.hash.slice(1); return VIEWS.some(v => v[0] === h) ? h : "overview"; }
function renderTabs() {
  const cur = route(), nChecks = A.checks.filter(c => c.sev === "warn" && c.items.length).length;
  const count = { ncr: A.NCR.open, sor: A.SOR.open, "stop-work": A.SWN.open, aconex: S.data.ACX.length ? A.ACX.open : null, "open-items": A.NCR.open + A.SOR.open + A.ACX.open, checks: nChecks };
  $("#tabs").innerHTML = VIEWS.map(([id, l]) => `<a href="#${id}" ${id === cur ? 'aria-current="page"' : ""}>${l}${count[id] != null && (id !== "checks" || nChecks) ? `<span class="cnt${id === "checks" ? " alert" : ""}">${count[id]}</span>` : ""}</a>`).join("");
}
function tile(l, v, s, st = "", go = "", unit = "") {
  const inner = `<span class="l">${l}</span><span class="v">${v}${unit ? `<small>${unit}</small>` : ""}</span><span class="s">${s}</span>`;

}
const perTxt = () => `${fmt(A.perStart, {})} – ${fmtL(A.rpt)}`;
function delta(now, prev) { const d = now - prev; const sign = d > 0 ? "+" : d < 0 ? "−" : "±"; return `<span class="delta">${sign}${Math.abs(d)}</span> vs previous ${A.per} days (${prev})`; }
function header() {

  const banner = S.demo ? `<div class="banner"><span><b>Demo data.</b> These figures are fictional examples. Load your NCR / SOR tracker, the contractor incident log and the Aconex issues export to see the real position.</span><button class="btn" type="button" data-act="load">Load trackers</button></div>` : "";

}
const card = (id, h, sub, tall) => `<div class="card"><h3>${h}</h3><p class="sub">${sub}</p><div class="cv${tall ? " tall" : ""}"><canvas id="${id}" role="img" aria-label="${esc(h)}"></canvas></div></div>`;

/* ---------- filter bar (drives tiles, charts and table) ---------- */
const match = (q, ...f) => !q || f.join(" ").toLowerCase().includes(q.toLowerCase());
const uniq = (rows, k) => [...new Set(rows.map(r => typeof k === "function" ? k(r) : r[k]).filter(Boolean))].sort();
const sel = (id, label, cur, opts) => `<label class="ctl" for="${id}">${label}<select id="${id}"><option value="">All</option>${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(l)}</option>`; }).join("")}</select></label>`;
function filterBar(k, fields, shown, total, noun) {
  const st = UI[k], active = fields.filter(f => st[f.key]).map(f => `${f.label}: ${(o => Array.isArray(o) ? o[1] : st[f.key])(f.opts.find(o => (Array.isArray(o) ? o[0] : o) === st[f.key]))}`);
  if (st.q) active.unshift(`Search “${st.q}”`);
  return `<section class="fbar${active.length ? " on" : ""}"><div class="filters"><span class="flab">Filter</span>
    <input type="search" id="q-${k}" placeholder="Search…" value="${esc(st.q)}" aria-label="Search">
    ${fields.map(f => sel(`${f.key}-${k}`, f.label, st[f.key], f.opts)).join("")}
    ${active.length ? `<button class="btn" type="button" data-clear="${k}">Clear filters</button>` : ""}</div>
    <div class="fsum">${active.length ? `Showing <b>${shown}</b> of ${total} ${noun} · ${active.map(esc).join(" · ")}. Tiles and charts below use this selection.` : `Showing all ${total} ${noun}. Pick a filter, or click a bar in a chart, to narrow every tile and chart below.`}</div></section>`;
}
function wireFilters(k, keys) {

  document.querySelectorAll(`[data-clear="${k}"]`).forEach(b => b.addEventListener("click", () => { st.q = ""; for (const key of keys) st[key] = ""; render(); }));
}
const setF = (k, key, v) => { UI[k][key] = v; render(); };

/* ---------- generic table ---------- */
function table(id, cols, rows, st) {
  const [sk, sd] = st.sort; const col = cols.find(c => c.k === sk) || cols[0];
  const val = r => { const v = col.v ? col.v(r) : r[col.k]; return v instanceof Date ? +v : v; };
  const sorted = [...rows].sort((a, b) => { const x = val(a), y = val(b); if (x == null || x === "") return 1; if (y == null || y === "") return -1; return (x > y ? 1 : x < y ? -1 : 0) * sd; });
  const shown = sorted.slice(0, 600);
  return `<div class="tablebox"><table id="${id}"><thead><tr>${cols.map(c => `<th scope="col" data-k="${c.k}" ${c.k === sk ? `aria-sort="${sd > 0 ? "ascending" : "descending"}"` : ""}>${c.l}</th>`).join("")}</tr></thead>
  <tbody>${shown.map(r => `<tr>${cols.map(c => `<td class="${c.cls || ""}">${c.h ? c.h(r) : esc(r[c.k])}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${cols.length}" style="text-align:center;color:var(--muted);padding:24px">No items match these filters.</td></tr>`}</tbody></table></div>
  <div class="rowcount">${rows.length} item${rows.length === 1 ? "" : "s"}${rows.length > shown.length ? ` · showing the first ${shown.length}` : ""}</div>`;
}
function wireSort(id, st) { const t = document.getElementById(id); if (!t) return; t.querySelectorAll("th").forEach(th => th.addEventListener("click", () => { const k = th.dataset.k; st.sort = st.sort[0] === k ? [k, -st.sort[1]] : [k, ["age", "issue", "date", "due"].includes(k) ? -1 : 1]; render(); })); }
const pill = s => { const m = STATUS[s]; return m ? `<span class="pill ${m[1]}">${m[0]}</span>` : `<span class="pill p-mute">${esc(s)}</span>`; };
const gPill = r => `<span class="pill ${r.isOpen ? (r.overdue ? "p-crit" : "p-warn") : r.isVoid ? "p-mute" : "p-good"}">${esc(r.status || "(blank)")}</span>`;
const ageH = r => r.age == null ? "" : `<span class="age ${r.age > 60 ? "a60" : r.age > 30 ? "a30" : ""}">${r.age} d</span>`;
const dH = k => r => fmt(r[k]);
const statusPass = v => r => !v || (v === "open" ? r.isOpen : v === "over30" ? r.age > 30 : v === "closed" ? r.isClosed : v === "overdue" ? r.overdue : r.status === v);
function listHead(k, title, opts) { return `<div class="filters" style="margin-bottom:10px"><h2 style="margin:0 auto 0 0">${title}</h2>${sel(`st-${k}`, "Show", UI[k].st, opts)}</div>`; }
function wireList(k, tid) { wireSort(tid, UI[k]); const el = document.getElementById(`st-${k}`); if (el) el.addEventListener("change", () => { UI[k].st = el.value; render(); }); }

/* =====================================================================
   Loading files
   ===================================================================== */
async function loadFiles(files) {
  const results = [], notes = [];
  for (const file of files) {
    try { const wb = XLSX.read(await file.arrayBuffer(), { type: "array" }); const found = parseWorkbook(wb, file.name);
      if (!Object.keys(found).length) notes.push(`${file.name}: no NCR, SOR, stop-work, incident or Aconex issues register found`);
      results.push(found);
    } catch (e) { notes.push(`${file.name}: could not be read (${e.message})`); }
  }
  const merged = {}; for (const f of results) for (const k in f) if (!merged[k] || f[k].rows.length >= merged[k].rows.length) merged[k] = f[k];
  if (!Object.keys(merged).length) { toast(notes.join("\n") || "No data found in those files."); return; }
  const span = S.from && S.to && !S.demo ? days(S.to, S.from) : 6;
  if (S.demo) { S.data = emptyData(); S.meta = {}; S.demo = false; S.from = S.to = null; }
  let hd = null;
  for (const k in merged) { const m = merged[k];
    S.data[k] = k === "INC" ? cleanINC(m.rows) : k === "SWN" ? cleanSWN(m.rows) : k === "ACX" ? cleanACX(m.rows) : cleanFindings(m.rows, k);
    S.meta[k] = { file: m.file, sheet: m.sheet, headerDate: m.headerDate || null, missing: m.missing.filter(f => f !== "remarks" && !(DATASETS[k].optional || []).includes(f)), loaded: new Date().toISOString() };
    if (!hd && m.headerDate && k !== "INC" && k !== "ACX") hd = m.headerDate;
    notes.unshift(`${DATASETS[k].label}: ${S.data[k].length} rows from "${m.sheet}"${S.meta[k].missing.length ? ` (missing: ${S.meta[k].missing.join(", ")})` : ""}`);
  }
  if (hd) S.to = hd;
  if (!S.to) { const all = [...S.data.NCR, ...S.data.SOR, ...S.data.ACX].map(r => r.issue).concat(S.data.INC.map(r => r.date)).filter(Boolean); S.to = all.length ? new Date(Math.max(...all)) : new Date(); }
  if (hd || !S.from) S.from = addD(S.to, -span);
  render(); snapshot(); persist();
  toast(notes.join("\n") + (hd ? `\nPeriod set to ${fmt(S.from, {})} – ${fmtL(hd)} (to date from the tracker header).` : ""), 7000);
}

    r0 += 1; section(r0, "Trends and breakdowns");
    const imgs = [[p => CFG.monthly(p, N), "NCRs issued and closed per month"], [p => CFG.monthly(p, R), "SORs issued and closed per month"],
      [p => CFG.backlog(p, [["NCR open", N], ["SOR open", R]]), "Open backlog at month end"], [p => CFG.age(p, [["NCR", N], ["SOR", R]]), "Open items by age"],
      [p => CFG.events(p, I), "Incident log events per month"], [p => CFG.topBy(p, I.rows, "category", null, 8, "Events"), "Most frequent event categories"],
      [p => CFG.split(p, N.rows, "category"), "NCRs by category"], [p => CFG.swnThemes(p, W.rows), "Stop work notices by theme"],
      ...(hasX ? [[p => CFG.monthly(p, X, ["Raised", "Closed"]), "Aconex issues raised and closed per month"], [p => CFG.topBy(p, X.rows.filter(r => r.isOpen), "assignedOrg", null, 8, "Open issues"), "Open Aconex issues by assigned organisation"]] : [])];
    const top = r0 + 1;
    imgs.forEach(([make, h], i) => { const id = wb.addImage({ base64: png(make, h), extension: "png" }); const r = top + Math.floor(i / 2) * 15;
      ws.addImage(id, { tl: { col: i % 2 ? 7 : 1, row: r - 1 }, ext: { width: 520, height: 243 } }); });
    const noteRow = top + Math.ceil(imgs.length / 2) * 15 + 1; ws.mergeCells(`B${noteRow}:M${noteRow + 1}`);
    Object.assign(ws.getCell(`B${noteRow}`), { value: "Definitions: Open = any status other than Closed or Terminated (Aconex: other than Closed or Cancelled). Age = period end date minus issue date. 1st response on time = contractor responded within 7 days (tracker column). Recordable = MTC, RWC, LWC, fatality, occupational illness.", font: { name: F, size: 8, italic: true, color: { argb: MUTED } }, alignment: { wrapText: true, vertical: "top" } });
    ws.pageSetup.printArea = `A1:N${noteRow + 1}`;

    const sheet = (name, cols, rows) => { const s = wb.addWorksheet(name, { views: [{ state: "frozen", ySplit: 1 }], pageSetup: { paperSize: 9, orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
      s.columns = cols.map(c => ({ header: c[0], key: c[0], width: c[2] || 14 }));
      rows.forEach(r => { const row = s.addRow(cols.map(c => c[1](r))); cols.forEach((c, i) => { const cell = row.getCell(i + 1); if (cell.value instanceof Date) cell.numFmt = "dd-mmm-yy"; cell.alignment = { vertical: "top", wrapText: !!c[3] }; cell.font = { name: F, size: 9 }; }); });
      const h = s.getRow(1); h.height = 28; h.eachCell(c => { c.font = { name: F, size: 9, bold: true, color: { argb: "FFFFFFFF" } }; c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: GREEN } }; c.alignment = { vertical: "middle", wrapText: true }; });
      s.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: cols.length } }; return s; };
    const st = s => STATUS[s] ? STATUS[s][0] : s;
    const open = openRows().sort((a, b) => (b.age ?? -1) - (a.age ?? -1));
    sheet("Open Items", [["Type", r => r.ds, 8], ["Reference", r => r.ref, 44], ["Category", r => r.category, 9], ["Description", r => r.desc, 60, 1], ["Issued", r => r.issue, 11], ["Days open", r => r.age, 9], ["Status", r => st(r.status), 15], ["Severity", r => r.severity, 11], ["Raised by", r => r.raisedBy, 12]], open);
    const reg = (k) => sheet(`${k} Register`, [["Reference", r => r.ref, 44], ["Category", r => r.category, 9], ...(k === "NCR" ? [["Severity", r => r.severity, 11]] : []), ["Description", r => r.desc, 60, 1], ["Issued", r => r.issue, 11],
      ["Response due", r => r.respReq, 12], ["Status", r => st(r.status), 15], ["Days open", r => r.age, 9], ["Final closure", r => r.closure, 12], ["Days to close", r => r.toClose, 10], ["1st response on time", r => r.onTime ? "Yes" : "No", 10], ["Raised by", r => r.raisedBy, 12]],
      [...A[k].rows].sort((a, b) => (b.issue || 0) - (a.issue || 0)));
    reg("NCR"); reg("SOR");
    sheet("Stop Work", [["Reference", r => r.ref, 40], ["Description", r => r.desc, 60, 1], ["Theme", r => r.theme, 18], ["Issued", r => r.issue, 11], ["Returned to contractor", r => r.closure, 14], ["Status", r => title(r.status), 10], ["Contractor reply", r => r.contractorRef, 24]], W.rows);
    sheet("Incident Log", [["Date", r => r.date || r.dateText, 11], ["Type", r => r.type, 18], ["Group", r => r.group, 14], ["Category", r => r.category, 26], ["Description", r => r.desc, 70, 1], ["High potential", r => r.hipo ? "Yes" : "No", 9], ["Lost days", r => r.lostDays, 8], ["Log status", r => r.statusRaw, 10]], [...I.rows].sort((a, b) => (b.date || 0) - (a.date || 0)));
    if (hasX) sheet("Aconex Issues", [["Issue", r => r.ref, 18], ["Title", r => r.title || r.desc, 50, 1], ["Type", r => r.type, 16], ["Status", r => r.status, 12], ["Priority", r => r.priority, 10],
      ["Assigned organisation", r => r.assignedOrg, 22], ["Assigned to", r => r.assignedTo, 18], ["Location", r => r.location, 16], ["Raised", r => r.issue, 11], ["Due", r => r.due, 11],
      ["Past due", r => r.overdue ? "Yes" : "", 8], ["Days open", r => r.age, 9], ["Closed", r => r.closure, 11], ["Raised by", r => r.raisedBy, 14]], [...X.rows].sort((a, b) => (b.issue || 0) - (a.issue || 0)));
    const buf = await wb.xlsx.writeBuffer();
    await saveFile(`${(PROJECT.name || "Site").replace(/[^A-Za-z0-9-]+/g, "_")}_HSE_Dashboard_${iso(A.rpt)}.xlsx`, new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  } catch (e) { console.error(e); toast("Could not build the Excel file: " + e.message); }
  finally { btn.disabled = false; btn.textContent = "Download client Excel"; render(); }
}

/* =====================================================================
   Demo data (fictional)
   ===================================================================== */
function demo() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647, pick = a => a[Math.floor(rnd() * a.length)];
  const rpt = new Date(2026, 9, 7), start = new Date(2025, 9, 20), span = days(rpt, start);
  const who = ["Inspector A", "Inspector B", "Inspector C", "Inspector D", "Inspector E", "Inspector F"];
  const ncrTxt = ["Unauthorised lifting operation at tower crane TC-2", "Scaffold tags missing on core wall access", "Inadequate edge protection at L2 slab", "Expired third-party certificate for mobile crane", "Poor housekeeping at rebar yard", "Hot work without valid permit", "Dust suppression not maintained at excavation", "Workers without harness anchorage at formwork", "Missing traffic marshal at gate 3", "Uncontrolled access to deep excavation"];
  const sorTxt = ["Formwork props not plumb at grid C4", "Concrete pour without approved checklist", "Curing compound not applied to slab", "Rebar cover blocks missing", "Fire extinguisher overdue for inspection", "Blocked emergency exit at welfare cabin", "Spill kit missing at diesel bowser", "Lighting inadequate in basement B2"];
  const mkF = (n, ds, cats, txts) => Array.from({ length: n }, (_, i) => { const issue = addD(start, Math.floor(Math.pow(rnd(), .7) * span)); const age = days(rpt, issue);
    const closed = rnd() < (age > 40 ? .85 : age > 14 ? .55 : .2); const term = !closed && rnd() < .04;
    const status = closed ? "CLOSED" : term ? "TERMINATED" : pick(["OPEN", "REJECTED", "REJECTED", "PENDING", "RESPONDED"]);
    return { ref: `DEMO-${ds}-${String(i + 1).padStart(4, "0")}`, category: pick(cats), severity: ds === "NCR" ? (rnd() < .5 ? "Not graded" : pick(["Major", "Moderate"])) : "", desc: pick(txts), issue,
      closure: closed ? addD(issue, 5 + Math.floor(rnd() * Math.min(70, Math.max(6, age - 5)))) : null, respReq: addD(issue, 7), raisedBy: pick(who), status, onTime: rnd() < .3, remarks: "" }; });
  const clamp = r => { if (r.closure && r.closure > rpt) r.closure = rpt; return r; };
  const inc = Array.from({ length: 52 }, () => { const t = pick(["Near Miss", "Near Miss", "Near Miss", "Near Miss", "Near Miss", "First Aid Case", "Equipment / Property Damage", "Medical Treatment Case"]);
    return { date: addD(start, Math.floor(rnd() * span)), dateText: "", type: t, group: TYPE_GROUPS[t.toLowerCase()], typeKnown: true, category: pick(["Plant People Interface", "Fall from Height (Person)", "Slip Trip and Fall", "Lifting Equipment", "Fall From Height (Object)", "Plant Damage", "Manual Handling"]),
      categoryRaw: "", desc: "Fictional example event for demonstration.", severity: "1 Low", hipo: rnd() < .04, injury: "", body: "", lostDays: t === "Medical Treatment Case" ? 2 : 0, contractor: "Demo contractor", statusRaw: rnd() < .9 ? "Closed" : "Open", isOpen: false, lessons: "" }; });
  inc.forEach(r => r.isOpen = r.statusRaw !== "Closed");
  const swn = ["Lifting operation without approved lift plan", "Work at height without edge protection", "Working without approved RAMS", "Unsafe access to excavation", "Dust control failure at haul road", "Laydown area storage non-compliance"].map((d, i) => { const issue = addD(start, 40 + i * 45); return { ref: `DEMO-SWN-${String(i + 1).padStart(3, "0")}`, desc: d, issue, closure: addD(issue, 10 + i * 4), respReq: addD(issue, 7), raisedBy: "Inspector A", status: "CLOSED", contractorRef: `DEMO-REPLY-${i + 1}`, theme: swnTheme(d) }; });
  const orgs = ["Main contractor", "MEP subcontractor", "Facade subcontractor", "Design consultant"], types = ["Safety observation", "Quality defect", "Environmental", "Design query", "Snag"];
  const acx = Array.from({ length: 70 }, (_, i) => { const issue = addD(start, Math.floor(Math.pow(rnd(), .6) * span)); const age = days(rpt, issue); const closed = rnd() < (age > 30 ? .8 : .35);
    return { ref: `DEMO-ISS-${String(i + 1).padStart(4, "0")}`, title: pick(["Missing guardrail at stair core", "Exposed rebar ends without caps", "Water ponding near electrical panel", "Fire door wedged open", "Damaged waterproofing at podium", "Drawing clash at level 3 duct"]),
      desc: "", type: pick(types), status: closed ? "Closed" : pick(["Open", "Open", "Responded"]), priority: pick(["High", "Medium", "Medium", "Low"]), raisedBy: pick(who), assignedOrg: pick(orgs), assignedTo: "",
      location: pick(["Basement B2", "Level 1", "Podium", "Roof"]), issue, due: addD(issue, 14), closure: closed ? addD(issue, 3 + Math.floor(rnd() * Math.max(4, Math.min(45, age - 2)))) : null, remarks: "" }; });
  Object.assign(S, { data: { ACX: acx.map(clamp), NCR: mkF(120, "NCR", ["HSW", "HSW", "HSW", "STR", "LOG", "CIV"], ncrTxt).map(clamp), SOR: mkF(135, "SOR", ["STR", "STR", "HSE", "HSE", "LOG", "ENV"], sorTxt).map(clamp), SWN: swn, INC: inc },
    meta: { NCR: { file: "demo", headerDate: rpt, missing: [] }, SOR: { file: "demo", headerDate: rpt, missing: [] }, SWN: { file: "demo", headerDate: rpt, missing: [] }, INC: { file: "demo", missing: [] }, ACX: { file: "demo", missing: [] } }, from: addD(rpt, -6), to: rpt, demo: true });
}

/* =====================================================================
   Wiring
   ===================================================================== */
$("#loadBtn").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", e => { if (e.target.files.length) loadFiles([...e.target.files]); e.target.value = ""; });
$("#xlsBtn").addEventListener("click", exportExcel);
$("#from").addEventListener("change", e => { const d = fromIso(e.target.value); if (d) { S.from = d; if (S.to && d > S.to) S.to = d; persist(); render(); } });
$("#to").addEventListener("change", e => { const d = fromIso(e.target.value); if (d) { S.to = d; if (S.from && S.from > d) S.from = d; persist(); render(); } });
$("#preset").addEventListener("change", e => { const v = e.target.value, to = A.rpt; if (!v) return;
  if (v === "month") S.from = new Date(to.getFullYear(), to.getMonth(), 1);
  else if (v === "prevmonth") { S.to = new Date(to.getFullYear(), to.getMonth(), 0); S.from = new Date(S.to.getFullYear(), S.to.getMonth(), 1); }
  else S.from = addD(to, -(+v - 1));
  if (v !== "prevmonth") S.to = to; persist(); render(); });
if (!window.claude) { const pb = $("#printBtn"); pb.hidden = false; pb.addEventListener("click", () => window.print()); }
let clearArm = 0; $("#clearBtn").addEventListener("click", e => { const b = e.currentTarget;
  if (Date.now() - clearArm < 4000) { store("hse-dash-v1"); store(HKEY); demo(); render(); b.textContent = "Clear stored data"; clearArm = 0; toast("Stored data and history cleared. Showing demo data."); return; }
  clearArm = Date.now(); b.textContent = "Click again to clear"; setTimeout(() => { if (Date.now() - clearArm >= 3900) b.textContent = "Clear stored data"; }, 4000); });
let dragN = 0; const drop = $("#drop");
addEventListener("dragenter", e => { if ([...(e.dataTransfer?.types || [])].includes("Files")) { dragN++; drop.hidden = false; } });
addEventListener("dragleave", () => { if (--dragN <= 0) { dragN = 0; drop.hidden = true; } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); dragN = 0; drop.hidden = true; const f = [...(e.dataTransfer?.files || [])].filter(f => /\.xls[xmb]?$/i.test(f.name)); if (f.length) loadFiles(f); });
addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
const rerender = () => { if (A) render(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", rerender);
new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

applyBrand();
if (!restore()) demo();
render();
</script>
